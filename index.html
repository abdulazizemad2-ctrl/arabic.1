<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بنك أسئلة مهارات اللغة العربية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
html{color-scheme:light}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: a single exam-sheet column; bubble-sheet answer letters, topic chips, sticky progress bar */
:root{
  --bg:#EEF2F1; --paper:#FFFFFF; --ink:#16232E; --muted:#5D6B72; --line:#D4DDDB;
  --accent:#0E6E62; --accent-soft:#DCEEEA; --ok:#1F7A3D; --ok-soft:#E1F2E6; --bad:#B23A2E; --bad-soft:#F8E3E0;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171C; --paper:#17232A; --ink:#E6EDEC; --muted:#93A4A8; --line:#2A3A41;
  --accent:#4FC2AE; --accent-soft:#163631; --ok:#5FD08A; --ok-soft:#163525; --bad:#F08A7E; --bad-soft:#3A1E1B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171C; --paper:#17232A; --ink:#E6EDEC; --muted:#93A4A8; --line:#2A3A41;
  --accent:#4FC2AE; --accent-soft:#163631; --ok:#5FD08A; --ok-soft:#163525; --bad:#F08A7E; --bad-soft:#3A1E1B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;direction:rtl}
.wrap{max-width:760px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,4vw,2.2rem);line-height:1.3;margin:0;text-wrap:balance}
.code{font-family:var(--body);font-size:.8rem;letter-spacing:.08em;color:var(--accent);font-weight:600}
.sub{color:var(--muted);margin:0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.label{font-size:.85rem;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-visible,.dot:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 20px;cursor:pointer;border:1px solid var(--accent);background:var(--accent);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mode{border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;text-align:right;display:flex;flex-direction:column;gap:4px}
.mode[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.mode b{font-family:var(--display);font-weight:500;font-size:1.1rem}
.mode span{font-size:.88rem;color:var(--muted)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;align-items:center;gap:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.track{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.qnum{font-family:var(--display);font-size:1rem;color:var(--accent)}
.tag{font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.qtext{font-size:1.15rem;font-weight:600;margin:0;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:right;width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:.85rem;font-weight:600;color:var(--muted);margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.opt:disabled{cursor:default}
.exp{border-inline-start:3px solid var(--accent);padding:8px 14px;background:var(--accent-soft);border-radius:4px;font-size:.95rem}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px}
.dot{font:inherit;font-size:.8rem;height:36px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.dot.ans{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.dot.cur{outline:2px solid var(--accent)}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:3rem;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:600}
.rev{display:flex;flex-direction:column;gap:12px}
.ritem{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ritem .q{font-weight:600}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.small{font-size:.9rem}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:6px">
    <div class="code">GS111 · نطاق الميدتيرم وفق الملخص النهائي</div>
    <h1>بنك أسئلة مهارات اللغة العربية (١)</h1>
    <p class="sub">أسئلة اختيار من متعدد وصح وخطأ، تُخلط الأسئلة والخيارات في كل محاولة.</p>
  </header>

  <section id="setup" class="panel">
    <div class="label">طريقة الحل</div>
    <div class="modes">
      <button class="mode" id="m-exam" aria-pressed="true"><b>محاكاة اختبار</b><span>لا تظهر الإجابات إلا بعد التسليم، مع تنقّل حر بين الأسئلة.</span></button>
      <button class="mode" id="m-prac" aria-pressed="false"><b>تدريب</b><span>تظهر الإجابة الصحيحة وسببها بعد كل سؤال مباشرة.</span></button>
    </div>
    <div class="label">الموضوعات</div>
    <div class="row" id="topics"></div>
    <div class="label">عدد الأسئلة</div>
    <div class="row" id="counts"></div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <span class="meta" id="avail"></span>
      <button class="btn" id="start">ابدأ</button>
    </div>
  </section>

  <section id="quiz" hidden style="display:flex;flex-direction:column;gap:16px">
    <div class="bar"><div class="track"><div class="fill" id="fill"></div></div><span class="meta" id="prog"></span><span class="meta" id="timer">00:00</span></div>
    <article class="panel" id="card"></article>
    <div class="nav">
      <button class="btn ghost" id="prev">السابق</button>
      <div class="row">
        <button class="btn ghost" id="finish">تسليم</button>
        <button class="btn" id="next">التالي</button>
      </div>
    </div>
    <div class="panel" id="gridWrap"><div class="label">خريطة الأسئلة</div><div class="grid" id="grid"></div></div>
  </section>

  <section id="result" hidden class="panel"></section>
</div>

<script>
const T=["الأول: مدخل إلى مهارات اللغة","الثاني: مهارات التحدث وآداب الحوار","الثالث: القراءة الجهرية","الرابع: مهارات الجهرية وتقويمها","الخامس: تطبيقات الجهرية","السادس: القراءة الصامتة"];
const TS=["الأول","الثاني","الثالث","الرابع","الخامس","السادس"];
// MC: [topic, question, [correct, d1, d2, d3], explanation]   TF: [topic, statement, true|false, explanation]
const B=[
[0,"عرّف ابن جنّي اللغة بأنها:",["أصوات يعبّر بها كل قوم عن أغراضهم","ألفاظ يتواضع عليها كل قوم لمعانيهم","أصوات يتفاهم بها الناس في معاشهم","رموز يعبّر بها الفرد عن حاجاته"],"تعريف ابن جني: «أصوات يعبّر بها كل قوم عن أغراضهم»."],
[0,"وظيفتا اللغة المتلازمتان هما:",["التعبيرية والتواصلية","الإفهامية والجمالية","المعرفية والاجتماعية","التعبيرية والتأثيرية"],"وظيفة تعبيرية عن الأفكار والمشاعر، ووظيفة تواصلية توجّه التعبير إلى الآخرين."],
[0,"أي العبارات الآتية تصف الفرق بين الاتصال والتواصل وصفاً صحيحاً؟",["الاتصال تغلب عليه الأحادية، والتواصل علاقة متبادلة","التواصل تغلب عليه الأحادية، والاتصال علاقة متبادلة","كلاهما علاقة متبادلة يتحقق فيها التفاعل بين الطرفين","كلاهما نقل أحادي للمعنى يسيطر فيه المرسل على الرسالة"],"الاتصال نقل أحادي يسيطر فيه المرسل، والتواصل تفاعل ومشاركة من الطرفين."],
[0,"أي مما يأتي ليس من أركان عملية التواصل كما وردت في المقرر؟",["الوسيط الإعلامي","المرسل (الباثّ)","الرصيد المشترك من الرموز","الرسالة اللغوية"],"الأركان: مرسل، ومتلقٍّ، ورسالة لغوية، ورصيد مشترك من الرموز."],
[0,"إذا لم يتوافر الرصيد المشترك من الرموز بين أفراد الجماعة فإن النتيجة:",["تعذّر التفاهم واختلال التفاعل الاجتماعي","تحوّل التواصل إلى اتصال أحادي الاتجاه","ضعف الوظيفة التعبيرية دون التواصلية","اقتصار الفهم على السياق والقرائن"],"نصّ المقرر: إذا لم تتوافر العناصر المشتركة تعذّر التفاهم واختلّ التفاعل."],
[0,"كانت العربية لغة العلم الأولى بين القرنين:",["الثامن والثالث عشر","السادس والعاشر","التاسع والخامس عشر","السابع والثاني عشر"],"بين القرنين الثامن والثالث عشر."],
[0,"أشار ابن خلدون في مقدمته إلى أن اللغة من أهم مقومات:",["العصبية","العمران","الدولة","الملك"],"اللغة من أهم مقومات «العصبية»، وارتباط الناس بها يعزز الانتماء."],
[0,"حمل اللفظ الواحد أكثر من معنى بحسب سياقه يُسمّى:",["المشترك اللفظي","الترادف","توسّع الدلالة","الاشتقاق"],"المشترك اللفظي: لفظ واحد لعدة معانٍ. والترادف عكسه: معنى واحد بعدة ألفاظ."],
[0,"اكتساب ألفاظ مثل (الصلاة، والزكاة، والصيام) دلالات شرعية مثالٌ على:",["انتقال اللفظ إلى معنى جديد بتوسّع الدلالة","توليد كلمات متعددة من أصل لغوي واحد","تعبير المعنى الواحد بأكثر من لفظ","الإيجاز في التعبير عن المعنى الشرعي"],"هذا من تعدد الدلالات بانتقال اللفظ من معناه القديم إلى معنى جديد."],
[0,"قاعدة «لكلّ مقامٍ مقال» ترتبط في المقرر بخصيصة:",["البلاغة","الفصاحة","الإيجاز","ثراء المفردات"],"البلاغة: التعبير بما يناسب المقام والسياق والمخاطب."],
[0,"«خير الكلام ما قلّ ودلّ» مصداقٌ لخصيصة:",["الإيجاز","البلاغة","الفصاحة","الاشتقاق"],"الإيجاز: التعبير بألفاظ قليلة من غير إخلال بالمعنى."],
[0,"أي مما يأتي ليس من صفات الكلام البليغ كما وردت في المقرر؟",["غزير المحسّنات","ملائم للمخاطب","دقيق في الدلالة","مؤثّر في المتلقي"],"البلاغة لا تقتصر على المحسنات؛ والصفات: واضح، مناسب للمقام، ملائم للمخاطب، دقيق، مؤثر."],
[0,"ترتبط الفصاحة بـ:",["سلامة اللفظ ووضوحه وحسن تأليفه","مناسبة الكلام لمقام المخاطب","قلة الألفاظ مع وفاء المعنى","تعدد الألفاظ للمعنى الواحد"],"الفصاحة: سلامة اللفظ ووضوحه وحسن تأليفه، بعيداً عن التعقيد."],
[0,"الأسئلة الأربعة التي يعرفها المتحدث الماهر هي:",["ماذا يقول؟ كيف يقوله؟ متى يقوله؟ كم يقول؟","ماذا يقول؟ لمن يقوله؟ أين يقوله؟ لماذا يقوله؟","من يخاطب؟ كيف يقول؟ أين يقول؟ متى يقول؟","ماذا يقول؟ لماذا يقوله؟ كيف يقوله؟ لمن يقوله؟"],"ماذا، وكيف، ومتى، وكم."],
[0,"مستوى القراءة الذي يُعدّ أعمق المستويات وأكثرها نشاطاً هو:",["القراءة التحليلية","القراءة للإبداع","القراءة الاستكشافية","القراءة الأساسية"],"التحليلية هي الأعمق والأنشط، أما الإبداعية فهي الأرقى والأعقد."],
[0,"المستوى الذي يطرح فيه القارئ الأسئلة ويقرأ ما بين السطور ويسجّل ملاحظاته على الهوامش:",["القراءة الاستكشافية","القراءة التحليلية","القراءة للإبداع","القراءة الأساسية"],"هذه سمات القراءة الاستكشافية، وبها تغدو القراءة محادثة حيّة."],
[0,"تتحول القراءة من استهلاك للمعرفة إلى إنتاج لها في مستوى:",["القراءة للإبداع","القراءة التحليلية","القراءة الاستكشافية","القراءة التمعّنية"],"القراءة للإبداع تتجاوز الكتاب الواحد وتوازن بين عدة كتب لتوليد معرفة جديدة."],
[0,"البحث عن رقم في دليل الهاتف مثالٌ على قراءة:",["الالتقاط","التصفّح","التمعّن","الاستكشاف"],"الالتقاط (Scanning): قراءة سريعة جداً للبحث عن معلومة محددة."],
[0,"يُعنى القارئ في قراءة التصفّح بالفقرات الأخيرة لأنها:",["مظنّة الخلاصة","مظنّة المقدمة","موضع المصطلحات","أصعب أجزاء النص"],"الفقرات الأخيرة مظنّة الخلاصة."],
[0,"وفق ما ورد في المقرر، تُقرأ القصة:",["تصفّحاً","التقاطاً","قراءة مركّزة","قراءة تحليلية"],"المجلة تُلتقط منها المعلومة، والكتاب العلمي قراءة مركّزة، والقصة تصفّحاً."],
[0,"المهارة الحقّ في سرعة القراءة تكمن في:",["المرونة بأن يعرف القارئ متى يبطئ ومتى يسرع","مضاعفة السرعة للاطلاع على أكبر قدر من المعرفة","الالتزام بسرعة واحدة ثابتة في جميع النصوص","الإبطاء الدائم لضمان الفهم العميق للنص"],"المهارة ليست في السرعة وحدها بل في المرونة."],
[0,"الإرشاد القرائي هو:",["توجيه القارئ والترغيب في القراءة وتعريفه بأصولها","المستوى الخامس من مستويات القراءة بعد الإبداع","تلخيص الكتاب في جملة أو فقرة تعكس مضمونه","قراءة عدة كتب في موضوع واحد والموازنة بينها"],"الإرشاد القرائي يصاحب المستويات، وهو توجيه القارئ وترغيبه وتعريفه بالأصول."],
[0,"وصفُ الكتاب بأنه «خير أنيس وجليس» يُنسب إلى:",["الجاحظ","ابن جنّي","ابن خلدون","ابن قتيبة"],"هذا وصف الجاحظ، وفيه إشارة إلى صلة القراءة بالبيان والتواصل."],
[0,"تُعدّ العربية جسراً للتواصل بين مجتمعات متعددة لأنها:",["تُستعمل في بلدان ومجتمعات متنوعة الأعراق والثقافات","تُدرَّس لغةً ثانية في أغلب جامعات العالم","حافظت على ألفاظها دون أي تعريب أو توليد","ترتبط ببيئة جغرافية واحدة متماسكة"],"العربية ليست محصورة في بيئة جغرافية واحدة، بل تُستعمل في مجتمعات متنوعة الأعراق والثقافات."],

[5,"القراءة الصامتة تعني غياب النشاط الذهني والاكتفاء بالنظر.",false,"خطأ: تعني الاستغناء عن النطق مع بقاء الإدراك والفهم."],
[5,"اللمس دون نطق يدخل في مفهوم القراءة الصامتة.",true,"صحيح: الاكتفاء بالنظر أو اللمس دون النطق."],
[5,"التوقّع نشاط استباقي يمكن مراجعته وتعديله في أثناء القراءة.",true,"صحيح، ويعدّله القارئ إذا ظهرت معلومات جديدة."],
[5,"كلما أمكن إقامة روابط مناسبة بين المعلومات الجديدة والمخزون السابق أصبح استيعابها أكثر رسوخاً.",true,"صحيح، كما ورد في مهارة الفهم."]
];

const L=["أ","ب","ج","د"];
const $=id=>document.getElementById(id);
let mode="exam", sel=new Set([0,1,2,3,5]), count=30, Q=[], cur=0, t0=0, tick=null, done=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function renderSetup(){
  $("topics").innerHTML=T.map((t,i)=>i===4?"":`<button class="chip" data-t="${i}" aria-pressed="${sel.has(i)}">${t}</button>`).join("");
  const n=B.filter(b=>sel.has(b[0])).length;
  $("counts").innerHTML=[20,30,50,"all"].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${count===c}">${c==="all"?"الكل":c}</button>`).join("");
  $("avail").textContent=`المتاح: ${n} سؤالاً`;
  $("start").disabled=n===0;
}
$("topics").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;const i=+b.dataset.t;sel.has(i)?sel.delete(i):sel.add(i);renderSetup()};
$("counts").onclick=e=>{const b=e.target.closest("[data-c]");if(!b)return;count=b.dataset.c==="all"?"all":+b.dataset.c;renderSetup()};
$("m-exam").onclick=()=>{mode="exam";$("m-exam").setAttribute("aria-pressed","true");$("m-prac").setAttribute("aria-pressed","false")};
$("m-prac").onclick=()=>{mode="prac";$("m-prac").setAttribute("aria-pressed","true");$("m-exam").setAttribute("aria-pressed","false")};

$("start").onclick=()=>{
  let pool=shuffle(B.filter(b=>sel.has(b[0])));
  if(count!=="all")pool=pool.slice(0,count);
  Q=pool.map(b=>{
    if(Array.isArray(b[2])){const o=shuffle(b[2].map((t,i)=>({t,c:i===0})));return{topic:b[0],q:b[1],opts:o.map(x=>x.t),ans:o.findIndex(x=>x.c),exp:b[3],tf:false,pick:null}}
    return{topic:b[0],q:b[1],opts:["صح","خطأ"],ans:b[2]?0:1,exp:b[3],tf:true,pick:null}
  });
  cur=0;done=false;t0=Date.now();
  clearInterval(tick);tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$("timer").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);
  $("setup").hidden=true;$("result").hidden=true;$("quiz").hidden=false;$("quiz").style.display="flex";
  $("gridWrap").hidden=mode!=="exam";
  render();window.scrollTo(0,0);
};

function render(){
  const q=Q[cur], reveal=mode==="prac"&&q.pick!==null;
  const answered=Q.filter(x=>x.pick!==null).length;
  $("fill").style.width=(answered/Q.length*100)+"%";
  $("prog").textContent=`${cur+1} / ${Q.length}`;
  $("card").innerHTML=`<div class="qhead"><span class="qnum">السؤال ${cur+1}</span><span class="tag">${q.tf?"صح أو خطأ":"اختيار من متعدد"} · الموضوع ${TS[q.topic]}</span></div>
  <p class="qtext">${q.q}</p>
  <div class="opts">${q.opts.map((o,i)=>{
    let c="";if(reveal){if(i===q.ans)c="right";else if(i===q.pick)c="wrong"}else if(q.pick===i)c="sel";
    return `<button class="opt ${c}" data-i="${i}" ${reveal?"disabled":""}><span class="bub">${L[i]}</span><span>${o}</span></button>`}).join("")}</div>
  ${reveal?`<div class="exp"><b class="${q.pick===q.ans?"ok":"bad"}">${q.pick===q.ans?"إجابة صحيحة.":"إجابة خاطئة."}</b> ${q.exp}</div>`:""}`;
  $("prev").disabled=cur===0;
  $("next").textContent=cur===Q.length-1?"عرض النتيجة":"التالي";
  $("finish").hidden=mode!=="exam";
  if(mode==="exam")$("grid").innerHTML=Q.map((x,i)=>`<button class="dot ${x.pick!==null?"ans":""} ${i===cur?"cur":""}" data-g="${i}">${i+1}</button>`).join("");
}
$("card").onclick=e=>{const b=e.target.closest(".opt");if(!b||b.disabled)return;const q=Q[cur];if(mode==="prac"&&q.pick!==null)return;q.pick=+b.dataset.i;render()};
$("grid").onclick=e=>{const b=e.target.closest("[data-g]");if(!b)return;cur=+b.dataset.g;render()};
$("prev").onclick=()=>{if(cur>0){cur--;render()}};
$("next").onclick=()=>{if(cur<Q.length-1){cur++;render();window.scrollTo({top:0})}else finish()};
let confirmArm=false;
$("finish").onclick=()=>{
  const left=Q.filter(x=>x.pick===null).length;
  if(left&&!confirmArm){confirmArm=true;$("finish").textContent=`تبقّى ${left}، اضغط للتأكيد`;setTimeout(()=>{confirmArm=false;$("finish").textContent="تسليم"},3500);return}
  confirmArm=false;$("finish").textContent="تسليم";finish();
};

function finish(){
  clearInterval(tick);done=true;
  const right=Q.filter(q=>q.pick===q.ans).length, pct=Math.round(right/Q.length*100);
  const s=Math.floor((Date.now()-t0)/1000);
  const rows=[...new Set(Q.map(q=>q.topic))].sort().map(t=>{const qs=Q.filter(q=>q.topic===t);const r=qs.filter(q=>q.pick===q.ans).length;return`<tr><td>${T[t]}</td><td>${r} / ${qs.length}</td><td>${Math.round(r/qs.length*100)}٪</td></tr>`}).join("");
  const wrong=Q.map((q,i)=>({q,i})).filter(x=>x.q.pick!==x.q.ans);
  $("quiz").hidden=true;$("quiz").style.display="none";
  $("result").hidden=false;
  $("result").innerHTML=`<div class="score"><span class="big">${pct}٪</span><span>${right} إجابة صحيحة من ${Q.length} · الزمن ${Math.floor(s/60)} د ${s%60} ث</span></div>
  <div style="overflow-x:auto"><table><thead><tr><th>الموضوع</th><th>الصحيح</th><th>النسبة</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="label">${wrong.length?`مراجعة الأخطاء (${wrong.length})`:"لا توجد أخطاء"}</div>
  <div class="rev">${wrong.map(({q,i})=>`<div class="ritem"><span class="tag" style="align-self:flex-start">السؤال ${i+1} · الموضوع ${TS[q.topic]}</span><div class="q">${q.q}</div>
  <div class="small bad">إجابتك: ${q.pick===null?"لم تُجب":q.opts[q.pick]}</div><div class="small ok">الصحيح: ${q.opts[q.ans]}</div><div class="small" style="color:var(--muted)">${q.exp}</div></div>`).join("")}</div>
  <div class="row"><button class="btn" id="again">محاولة جديدة</button><button class="btn ghost" id="back">تغيير الإعدادات</button></div>`;
  $("again").onclick=()=>$("start").click();
  $("back").onclick=()=>{$("result").hidden=true;$("setup").hidden=false;renderSetup()};
  window.scrollTo(0,0);
}
renderSetup();
</script>
</body>
</html>
